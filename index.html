<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0f" />
  <title>Aim Hand Tracker MVP</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">AIM ANALYSIS / MVP 0.1</p>
        <h1>Hand Tracker</h1>
      </div>
      <span id="modelStatus" class="status">モデル読込中</span>
    </header>

    <section class="card intro">
      <p>俯瞰で撮影したエイム動画を選択すると、手の21点を動画上に重ねて表示します。</p>
      <label class="fileButton" for="videoInput">動画を選択</label>
      <input id="videoInput" type="file" accept="video/*" />
      <p class="hint">解析はブラウザ内で実行します。動画ファイル自体はアップロードしません。</p>
    </section>

    <section id="viewerCard" class="card viewerCard isHidden">
      <div id="stage" class="stage">
        <video id="video" controls playsinline preload="metadata"></video>
        <canvas id="overlay"></canvas>
      </div>

      <div class="metrics">
        <div class="metric">
          <span>検出</span>
          <strong id="handCount">0 hand</strong>
        </div>
        <div class="metric">
          <span>左右</span>
          <strong id="handedness">—</strong>
        </div>
        <div class="metric">
          <span>推論</span>
          <strong id="inferenceTime">— ms</strong>
        </div>
      </div>

      <div class="controlsRow">
        <label class="toggle">
          <input id="showConnections" type="checkbox" checked />
          <span>骨格線</span>
        </label>
        <label class="toggle">
          <input id="showPoints" type="checkbox" checked />
          <span>21点</span>
        </label>
      </div>
    </section>

    <section class="card notes">
      <h2>撮影のコツ</h2>
      <ul>
        <li>手・マウス・マウスパッドが画面内に入るよう真上から撮影</li>
        <li>影を減らし、手と背景のコントラストを確保</li>
        <li>最初は10〜20秒程度の短い動画で確認</li>
      </ul>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
